name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # needed to upload SARIF results to the Security tab
  pull-requests: read

# All third-party actions are pinned to full commit SHAs (version kept in the comment).
# Dependabot (.github/dependabot.yml) opens PRs to bump both the SHA and the comment.

jobs:
  sast-codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
        with:
          languages: python
      - uses: github/codeql-action/analyze@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4

  secret-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.15"
      - run: pip install pip-audit
      - name: Audit dependencies (fails on known vulnerabilities)
        run: pip-audit -r app/requirements.txt

  iac-scan:
    name: IaC scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: bridgecrewio/checkov-action@83b08f51b20950f791f5caadcc92e336b371eb12 # v12.3143.0
        with:
          directory: terraform/
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif
      - uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov

  container-scan:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build image
        run: docker build -t demo-app:${{ github.sha }} app/
      - name: Trivy readable report (shows everything)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: demo-app:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: Trivy gate and SARIF (fixable HIGH/CRITICAL only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: demo-app:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"          # gate: fail on HIGH/CRITICAL that have a fix available
      - uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy

  dast-zap:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build image
        run: docker build -t demo-app:${{ github.sha }} app/
      - name: Start the app on a private Docker network
        run: |
          docker network create zapnet
          docker run -d --name demo-app --network zapnet -p 8080:8080 demo-app:${{ github.sha }}
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8080/health && break
            sleep 2
          done
      - name: Prepare report folder and ZAP rules
        run: |
          mkdir -p zap-out
          printf '10049\tINFO\t(Non-Storable Content)\n' > zap-out/zap-rules.conf
          chmod -R 777 zap-out
      - name: ZAP baseline scan
        run: |
          docker run --rm --network zapnet -v "$PWD/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://demo-app:8080 -c zap-rules.conf -r zap-report.html
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-report
          path: zap-out/zap-report.html

  security-gate:
    name: Security gate
    runs-on: ubuntu-latest
    needs: [sast-codeql, secret-scan, sca, iac-scan, container-scan, dast-zap]
    steps:
      - run: echo "All security checks passed."
