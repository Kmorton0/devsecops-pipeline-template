rules:
  - id: flask-route-id-lookup-without-authorization
    languages: [python]
    severity: WARNING
    message: >-
      This route looks up data by an id taken from the URL without checking
      that the caller is allowed to read it. Compare the id with the
      authenticated user (for example, if $ID != current_user_id(): abort(403))
      before returning data.
    metadata:
      category: security
      cwe: "CWE-639: Authorization Bypass Through User-Controlled Key"
      owasp: "A01:2021 Broken Access Control"
    patterns:
      - pattern-inside: |
          @app.route(...)
          def $FUNC(..., $ID, ...):
              ...
      - pattern-either:
          - pattern: $STORE[$ID]
          - pattern: $STORE.get($ID)
      - pattern-not-inside: |
          if $ID != current_user_id():
              abort(...)
          ...
